<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clean Cut</title>
<style>
  :root { --bg: #232323; --fg: #d6d6d6; --muted: #8a8a8a; --field: #1a1a1a; --line: #3a3a3a; --accent: #2d8ceb; --err: #ff6b6b; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 12px/1.4 -apple-system, sans-serif; }
  fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: var(--muted); padding: 0 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  input[type=number] { width: 70px; background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; }
  label.track { display: block; margin: 3px 0; }
  button { width: 100%; padding: 7px; margin-top: 6px; border: 0; border-radius: 4px; background: #3a3a3a; color: var(--fg); font-size: 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .pair { display: flex; gap: 4px; }
  button.small { width: auto; margin: 0; padding: 3px 8px; }
  #status { margin-top: 10px; white-space: pre-wrap; min-height: 2em; }
  #status.error { color: var(--err); }
  .hint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <fieldset>
    <legend data-t="listen"></legend>
    <div id="tracks"></div>
    <div class="hint" data-t="listenHint"></div>
  </fieldset>
  <fieldset>
    <legend data-t="settings"></legend>
    <div class="row"><label for="db" data-t="threshold"></label><span class="pair"><button id="auto" class="small" data-t="auto"></button><input id="db" type="number" step="1" max="0" min="-90"></span></div>
    <div class="row"><label for="min" data-t="minPause"></label><input id="min" type="number" step="0.1" min="0.1"></div>
    <div class="row"><label for="pad" data-t="padding"></label><input id="pad" type="number" step="10" min="0"></div>
  </fieldset>
  <button id="refresh" data-t="refresh"></button>
  <button id="analyze" data-t="analyze"></button>
  <button id="cut" class="primary" data-t="cut" disabled></button>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="lib/CSInterface.js"></script>
  <script src="planner.js"></script>
  <script src="main.js"></script>
</body>
</html>
