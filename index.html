<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Cut</title>
<style>
  :root { --bg: #232323; --fg: #d6d6d6; --muted: #8a8a8a; --field: #1a1a1a; --line: #3a3a3a; --accent: #2d8ceb; --err: #ff6b6b; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 12px/1.4 -apple-system, sans-serif; }
  fieldset { border: 1px solid var(--line); border-radius: 4px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: var(--muted); padding: 0 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .track { display: grid; grid-template-columns: 1fr auto 56px; align-items: center; gap: 6px; margin: 4px 0; }
  .track label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=number], select { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; font-size: 12px; }
  input[type=number] { width: 56px; box-sizing: border-box; }
  input:disabled { opacity: .4; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  button { width: 100%; padding: 7px; border: 0; border-radius: 4px; background: #3a3a3a; color: var(--fg); font-size: 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .wide { grid-column: 1 / -1; }
  #status { margin-top: 10px; white-space: pre-wrap; min-height: 2em; }
  #status.error { color: var(--err); }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  fieldset.balance { margin-top: 10px; }
  fieldset.balance button { margin-top: 6px; }
</style>
</head>
<body>
  <fieldset>
    <legend data-t="tracksTitle"></legend>
    <div id="tracks"></div>
    <div class="hint" data-t="tracksHint"></div>
  </fieldset>
  <fieldset>
    <legend data-t="settings"></legend>
    <div class="row"><label for="preset" data-t="preset"></label>
      <select id="preset">
        <option value="soft" data-t="presetSoft"></option>
        <option value="standard" data-t="presetStandard"></option>
        <option value="tight" data-t="presetTight"></option>
        <option value="custom" data-t="presetCustom"></option>
      </select></div>
    <div class="row"><label for="min" data-t="minPause"></label><input id="min" type="number" step="0.1" min="0.1"></div>
    <div class="row"><label for="pad" data-t="padding"></label><input id="pad" type="number" step="10" min="0"></div>
    <div class="row"><label for="speech" data-t="minSpeech"></label><input id="speech" type="number" step="0.1" min="0"></div>
    <div class="row"><label><input id="scope" type="checkbox"> <span data-t="scope"></span></label></div>
  </fieldset>
  <div class="buttons">
    <button id="refresh" class="wide" data-t="refresh"></button>
    <button id="analyze" data-t="analyze"></button>
    <button id="auto" data-t="auto"></button>
    <button id="markers" data-t="markers"></button>
    <button id="clearMarkers" data-t="clearMarkers"></button>
    <button id="cut" class="primary wide" data-t="cut"></button>
  </div>
  <fieldset class="balance">
    <legend data-t="balanceTitle"></legend>
    <div class="row"><label for="voice" data-t="voice"></label><input id="voice" type="number" step="1"></div>
    <div class="row"><label for="gameBelow" data-t="gameBelow"></label><input id="gameBelow" type="number" step="1" min="0"></div>
    <button id="balance" data-t="balance"></button>
    <div class="hint" data-t="balanceHint"></div>
  </fieldset>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="lib/CSInterface.js"></script>
  <script src="planner.js"></script>
  <script src="main.js"></script>
</body>
</html>
